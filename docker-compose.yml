services:
  db:
    image: postgres:16
    container_name: odoo19-db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    container_name: odoo19-app
    depends_on:
      - db
    ports:
      - '8069:8069'
      - '8072:8072'
    environment:
      HOST: 10.1.11.53
      USER: odoo19
      PASSWORD: odoo19
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/extra-addons
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
