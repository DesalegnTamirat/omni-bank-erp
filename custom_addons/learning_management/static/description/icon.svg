<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Book Cover Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c7d2fe"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#090d16" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Squircle Shape -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#lmsBg)"/>

  <!-- Subtle Inner Top Highlight -->
  <path d="M 0 56 A 56 56 0 0 1 56 0 L 200 0 A 56 56 0 0 1 256 56 L 256 70 C 200 80, 56 80, 0 70 Z" fill="white" opacity="0.08"/>

  <!-- Icon Foreground Group -->
  <g filter="url(#dropShadow)">
    <!-- Open Book Base -->
    <path d="M 38 184 Q 128 160 128 186 Q 128 160 218 184 L 210 134 Q 128 112 128 136 Q 128 112 46 134 Z" fill="url(#bookGrad)"/>
    <path d="M 40 188 Q 128 164 128 190 Q 128 164 216 188 L 218 196 Q 128 172 128 198 Q 128 172 38 196 Z" fill="#93c5fd" opacity="0.8"/>

    <!-- Bookmark Ribbon -->
    <path d="M 124 136 L 124 200 L 128 194 L 132 200 L 132 136 Z" fill="url(#goldGrad)"/>

    <!-- Graduation Cap (Mortarboard) -->
    <!-- Cap Skull -->
    <path d="M 76 96 Q 128 120 180 96 L 180 114 Q 128 140 76 114 Z" fill="#0f172a" opacity="0.95"/>
    <path d="M 76 114 Q 128 140 180 114 L 180 117 Q 128 144 76 117 Z" fill="url(#goldGrad)" opacity="0.8"/>

    <!-- Cap Diamond Top -->
    <polygon points="128,48 214,84 128,118 42,84" fill="#ffffff"/>
    <polygon points="128,52 206,84 128,114 50,84" fill="#1e293b"/>

    <!-- Cap Center Button -->
    <ellipse cx="128" cy="83" rx="7" ry="4" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Cap Tassel -->
    <path d="M 128 83 Q 165 92 186 115 L 186 138 Q 183 144 180 138 L 181 115" stroke="url(#goldGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <polygon points="178,136 188,136 185,152 181,152" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Video Play Badge Overlay (Signifying Online LMS Course) -->
    <g transform="translate(162, 140)" filter="url(#glow)">
      <circle cx="26" cy="26" r="24" fill="url(#goldGrad)"/>
      <circle cx="26" cy="26" r="21" fill="#1e293b"/>
      <polygon points="21,17 35,26 21,35" fill="url(#goldGrad)"/>
    </g>
  </g>
</svg>
