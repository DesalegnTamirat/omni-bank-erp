<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergency Loan Agreement</title>
<style>
@font-face{font-family:"NotoEth";font-weight:400;src:url(/resl/static/agreement/NotoSansEthiopic.woff2) format("woff2")}
:root{--bg:#f4f1ec;--panel:#fff;--ink:#1d1d1b;--muted:#6b665e;--line:#ddd7cc;--brand:#7a1f2b;--ok:#1e7a3c;--bad:#c62828;--req:#5df05d;--filled:#e4f8e4;--sys:#0b3d91}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1a18;--panel:#262523;--ink:#eeeae2;--muted:#a39e94;--line:#3a3834;--brand:#e58a96;--ok:#6fcf8c;--bad:#ff7a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"NotoEth",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
h1{font-size:16px;margin:0;font-weight:600}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.roles span,.roles select{border:1px solid var(--line);padding:6px 12px;border-radius:999px;font:inherit;background:transparent;color:var(--ink)}
.roles .me{background:var(--brand);border-color:var(--brand);color:#fff}
.roles button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}
.roles button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.roles .done::after{content:" ✓"}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px 16px}}
#pages{display:flex;flex-direction:column;gap:14px;align-items:center;min-width:0}
.page{position:relative;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);width:100%;max-width:820px;overflow:hidden}
.page canvas{display:block;width:100%;height:auto}
.pn{position:absolute;right:6px;top:4px;font-size:11px;color:#777;background:#fffa;padding:0 4px;border-radius:3px}
.fsig{position:absolute;display:flex;justify-content:flex-end;align-items:flex-end;pointer-events:none}
.fsig img{max-width:100%;max-height:100%;display:block}
.slot{position:absolute;color:#000;font-family:"NotoEth","Nyala",sans-serif;white-space:nowrap;overflow:hidden;cursor:pointer;display:flex;align-items:center}
.slot.miss{background:var(--req)}
.slot.ok{background:transparent}
.slot .v{background:transparent}
.slot.err{outline:2px solid var(--bad);outline-offset:0}
.slot .sys{color:var(--sys)}
.slot .ln{display:flex;white-space:nowrap;align-items:center}
.slot .ln span{white-space:nowrap}
.sig{position:absolute;border:1.5px dashed #2a7a2a;background:rgba(93,240,93,.35);display:flex;align-items:center;justify-content:center;color:#155;font:600 11px system-ui;cursor:pointer;text-align:center;overflow:hidden;line-height:1.2}
.sig.ok{background:transparent;border-color:transparent;color:#0a1f6b;font:700 12px system-ui,sans-serif}
.sig.todo{cursor:pointer}
.sig.err{outline:2px solid var(--bad)}
.sig img{max-width:100%;max-height:100%;display:block}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px;font-weight:600}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
label .sysTag{color:var(--sys);font-size:11px;margin-left:4px}
input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-family:"NotoEth",system-ui,sans-serif}
input[type=text][readonly]{opacity:.7}
input.invalid{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.msg{color:var(--bad);font-size:12px;min-height:0;margin-top:2px}
button.p{background:var(--brand);color:#fff;border:0;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer;transition:filter .12s,transform .08s,box-shadow .12s}
button.p:hover{filter:brightness(1.12);box-shadow:0 2px 8px rgba(0,0,0,.25)}
button.p:active{transform:scale(.96);filter:brightness(.88);box-shadow:none}
button.p:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button.p.busy,button.p:disabled{opacity:.75;cursor:progress;pointer-events:none}
button.p.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-2px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:rslspin .6s linear infinite}
@keyframes rslspin{to{transform:rotate(360deg)}}
.sig.todo{transition:filter .12s,transform .08s}
.sig.todo:hover{filter:brightness(.95);box-shadow:0 0 0 2px #2a7a2a inset}
.sig.todo:active{transform:scale(.97)}
.sig.busy{opacity:.6;cursor:progress;pointer-events:none}
button.s{background:transparent;color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
ul.st{list-style:none;margin:0;padding:0;font-size:13px}
ul.st li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.good{color:var(--ok)}.bad{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
/* ---- printing (approvers / admin): only the contract pages, one per sheet ---- */
@page{size:letter;margin:0}
@media print{
  html,body{background:#fff !important}
  header,aside,#toast,dialog,.pn{display:none !important}
  main{display:block !important;padding:0 !important;margin:0 !important;max-width:none !important}
  #pages{display:block !important;gap:0 !important}
  /* one letter sheet (8.5in = 816px) per page; the overlay is re-drawn at exactly this width
     in the beforeprint handler, so nothing is zoomed or shifted */
  .page{box-shadow:none !important;margin:0 !important;width:815px !important;max-width:none !important;overflow:hidden;
        break-inside:avoid;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  /* the white boxes cover the template's own placeholder text: they MUST be printed,
     even when the browser's "Background graphics" option is off */
  .page,.page *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  .slot,.slot.ok{background:#fff !important}
  .slot .v{background:transparent !important}
  .sig.todo{display:none !important}
}
</style>
</head>
<body>
<header>
  <h1>የአስቸኳይ ጊዜ የብድር ውል · Emergency Loan Contract</h1>
  <div class="roles" id="roles"></div>
</header>
<main>
  <div id="pages" aria-label="Contract"></div>
  <aside>
    <div class="card" id="formCard"></div>
    <div class="card" id="statusCard"></div>
  </aside>
</main>
<div id="toast"></div>

<script src="/web/static/lib/pdfjs/build/pdf.js"></script>
<script>
const CFG=/*CONFIG*/null;
const _PDF = (CFG && CFG.pdf) ? CFG.pdf : {};
const PAGES = (_PDF.pages && _PDF.pages.length) ? _PDF.pages : [1,2,3,4,5].map(n=>"/resl/static/agreement/page"+n+".png");
const NAMES = (CFG && CFG.names) ? CFG.names : {};
</script>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const ROLES={requester:"Borrower",approver:"Approver",guarantor:"Guarantor"};
/* "Name (Borrower)" / "Name (Guarantor)" / "Name (Approver)" - shown by name and role */
const whoName=(r,k)=>{const n=(r==="requester"?NAMES.sig_borrower:(r==="approver"?NAMES.sig_bank_a:((PARTS[k==null?ACTIVE:k]||{}).name)))||"";return n?n+" ("+ROLES[r]+")":ROLES[r]};

/* ---- values supplied by the system (amounts) ---- */
const SYSTEM=CFG.system;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- guarantor copies: one per guarantor ---- */
const PARTS=(CFG.parts&&CFG.parts.length)?CFG.parts:[{lineId:0,name:"",state:"",values:{},sig:"",complete:false,editable:false}];
const ACTIVE=Math.max(0,PARTS.findIndex(p=>p.mine||p.editable));   // the copy this user may agree to (guarantor only)
const BASE=id=>id.replace(/@\d+$/,"");                       // "b_date@1" -> "b_date"

/* Nothing is typed on this page: every value comes from the server (HR records).
   The only action is "Agree and continue", which puts "Agreed" where a signature used to be. */
const FIELDS_A=[["a_date","Agreement date"],["a_name","Name"],["a_city","City"],["a_subcity","Sub-city"],["a_woreda","Woreda"],["a_house","House number"],["a_phone","Phone"],["a_tax","Tax ID"],["a_emp","Employee ID"],["a_amt","Loan amount"],["a_amtw","Amount in words"],["a_start","Payment start date"],["a_inst","Monthly installment"],["a_instw","Installment in words"]];
const FIELDS_BANK=[["a_name","Borrower"],["a_amt","Loan amount"],["a_amtw","Amount in words"],["a_inst","Monthly installment"]];
const FIELDS_B=[["b_date","Agreement date"],["b_name","Name"],["b_address","Address"],["b_house","House number"],["b_tax","Tax ID"],["b_emp","Employee ID"],["b_phone","Phone"],["b_borrower","Borrower"],["b_bdate","Borrower's agreement date"],["b_amt","Loan amount"],["b_amtw","Amount in words"],["b_branch1","Borrower's branch"],["b_branch2","Guarantor's branch"]];
/* where "Agreed" is shown, and who it belongs to */
const SIGROLE=id=>id==="sig_borrower"?"requester":(id.startsWith("sig_bank")?"approver":"guarantor");
const copyOf=id=>{const m=id.match(/@(\d+)$/);return m?+m[1]:null};

/* ---- slots: green areas on the PDF (PDF points, origin top-left) ----
   NB (a no-break space, U+00A0) glues a label to its value so they never get separated by a line break. */
const NB="\u00a0";
const SLOTS_A = (_PDF.slots_a && _PDF.slots_a.length) ? _PDF.slots_a : [
 {p:"1",r:[[158,140,257,154]],t:"{a_date}"},
 {p:"1",r:[[258,140,383,154]],t:"{a_name}"},
 {p:"1",r:[[446,140,520,154],[72,156,407,168]],t:"{a_city}"+NB+"ከተማ {a_subcity} ክፍለ"+NB+"ከተማ፤ ወረዳ"+NB+"{a_woreda} ቤት.ቁጥር-"+NB+"{a_house} ቁጥር"+NB+"{a_phone}"},
 {p:"1",r:[[528,156,580,168]],t:"{a_tax}"},
 {p:"1",r:[[248,170,352,183]],t:"መታወቂያ"+NB+"ቁጥር-"+NB+"{a_emp}"},
 {p:"2",r:[[221,122,540,134]],t:"{a_amt} ({a_amtw})"},
 {p:"2",r:[[165,249,540,262],[126,268,204,280]],t:"{a_start} ጀምሮ በየወሩ {a_inst} ({a_instw})"},
];
const SLOTS_B = (_PDF.slots_b && _PDF.slots_b.length) ? _PDF.slots_b : [
 {p:"4",r:[[135,154,236,168]],t:"{b_date}"},
 {p:"4",r:[[237,154,362,168]],t:"{b_name}"},
 {p:"4",r:[[427,154,540,168],[72,168,257,180]],t:"{b_city}"+NB+"ከተማ {b_subcity} ክፍለ"+NB+"ከተማ፤ ወረዳ"+NB+"{b_woreda} የቤት."+NB+"ቁጥር"+NB+"{b_house}"},
 {p:"4",r:[[498,168,540,180]],t:"{b_tax}፤"},
 {p:"4",r:[[72,180,209,192]],t:"የ.መ.ቁ"+NB+"{b_emp} ፤ስ.ቁጥር"+NB+"{b_phone}"},
 {p:"4",r:[[302,221,433,234]],t:"{b_borrower}"},
 {p:"4",r:[[440,221,540,234]],t:"{b_bdate}"},
 {p:"4",r:[[253,241,540,254],[72,260,107,272]],t:"{b_amt} ({b_amtw})"},
 {p:"4",r:[[423,382,540,395],[144,401,350,413]],t:"{b_amt} ({b_amtw})"},
];
const SIGS_A = (_PDF.sigs_a && _PDF.sigs_a.length) ? _PDF.sigs_a : [
 {id:"sig_bank_a",p:"3",r:[100,440,205,479]},
 {id:"sig_borrower",p:"3",r:[385,440,495,479]},
];
const SIGS_B = (_PDF.sigs_b && _PDF.sigs_b.length) ? _PDF.sigs_b : [
 {id:"sig_bank_b",p:"5",r:[78,536,206,557]},
 {id:"sig_guarantor",p:"5",r:[389,536,514,557]},
];
const SLOTS=SLOTS_A.slice(),SIGS=SIGS_A.slice();
PARTS.forEach((pt,k)=>{
 SLOTS_B.forEach(s=>SLOTS.push({p:s.p+"@"+k,r:s.r,t:s.t.replace(/\{(b_\w+)\}/g,"{$1@"+k+"}")}));
 SIGS_B.forEach(g=>SIGS.push({id:g.id==="sig_guarantor"?"sig_guarantor@"+k:g.id,p:g.p+"@"+k,r:g.r}));
});
SLOTS.forEach((s,n)=>s.n=n);
const role=CFG.role;
/* All parties see the full agreement (borrower and guarantor pages) so each side
   can read what the other signed. Who can actually sign a page is controlled
   separately by SIGROLE. */
const DISPLAY=[{key:"1",n:1},{key:"2",n:2},{key:"3",n:3}];
PARTS.forEach((pt,k)=>DISPLAY.push({key:"4@"+k,n:4,k},{key:"5@"+k,n:5,k}));
/* ---- state ---- */
const S={values:Object.assign({},CFG.values),sigs:Object.assign({},CFG.sigs),files:CFG.files.slice(),status:CFG.status};
PARTS.forEach((pt,k)=>{for(const key in pt.values)S.values[key+"@"+k]=pt.values[key];if(pt.sig)S.sigs["sig_guarantor@"+k]=pt.sig});
const agreedAlready=()=>role==="guarantor"?!!PARTS[ACTIVE].complete:!!S.status[role];
const CAN=CFG.editable&&role!=="viewer";
/* every blank of the agreement is filled: a value that is missing, empty or only spaces is written as "-" */
const clean=v=>{const s=(v==null?"":String(v)).replace(/[\s\u00a0]+/g," ").trim();return(!s||s==="undefined"||s==="null"||s==="false")?"-":s};
/* several phone numbers may be stored in one field (separated by / \ , ; | & ፣ ፤ or the word "or"): only the first one is written */
const firstPhone=v=>clean(String(v==null?"":v).split(/[\/\\,;|&፣፤]|\s+(?:or|እና|ወይም)\s+/i)[0]);
const val=id=>{
  const b=BASE(id);
  if(b==="a_amt"||b==="b_amt")return clean(SYSTEM.amount);
  if(b==="a_inst")return clean(SYSTEM.installment);
  if(b==="a_phone"||b==="b_phone")return firstPhone(S.values[id]);
  return clean(S.values[id]);
};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2600)};
async function post(path,fd){
  fd.append("csrf_token",CFG.csrf);
  const r=await fetch("/resl/agreement/"+CFG.loanId+path,{method:"POST",body:fd,credentials:"same-origin"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
/* "Agree and continue": tell the server this person agreed */
let AGREEING=false;
const setBusy=on=>{
  AGREEING=on;
  document.querySelectorAll("button.p").forEach(b=>{
    if(b.dataset.agree==null)return;
    b.classList.toggle("busy",on);
    b.textContent=on?"Saving…":"Agree and continue";
  });
  document.querySelectorAll(".sig.todo").forEach(d=>d.classList.toggle("busy",on));
};
async function agree(){
  if(AGREEING)return;
  if(!CAN){toast("This part is locked or view only");return}
  if(agreedAlready()){finish();return}
  if(CFG.preview){
    /* New flow: the borrower cannot agree before the guarantors do.
       The preview page is view-only for the requester. */
    toast("You must find a guarantor first. The guarantor(s) agree before the borrower.");
    return;
  }
  setBusy(true);
  try{
    const fd=new FormData();
    fd.append("payload",JSON.stringify({role,lineId:CFG.lineId}));
    const j=await post("/save",fd);
    if(!j.ok){setBusy(false);toast(j.message||"Could not save");return}
    S.status[role]=true;
    if(role==="requester")S.sigs.sig_borrower="Agreed";
    else if(role==="approver")S.sigs.sig_bank_a=S.sigs.sig_bank_b="Agreed";
    else{PARTS[ACTIVE].complete=true;S.sigs["sig_guarantor@"+ACTIVE]="Agreed"}
    if(EMBED)window.parent.postMessage({type:"resl_agreement_saved"},location.origin);
    AGREEING=false;renderAll();toast("Agreed");finish();
  }catch(x){setBusy(false);toast("Could not save: "+x.message)}
}

/* ---- PDF ---- */
let pageEls={},scale=1,pending=0;
const ctx=document.createElement("canvas").getContext("2d");
const EMBED=window.parent!==window;   // shown as a popup inside the loan form
/* Done: close the popup (the loan form refreshes itself) or, when opened on its own, the tab */
function finish(){
  if(EMBED){window.parent.postMessage({type:"resl_agreement_done"},location.origin);return}
  toast(CFG.preview?"Agreed. You can close this tab and go back to the request.":"Saved. You can close this tab and go back to the loan.");
  setTimeout(()=>{try{window.close()}catch(e){}},800);
}
const FONT='"NotoEth","Nyala",sans-serif';        // same stack as .slot, so measuring == rendering
const MINFS=7;                                    // smallest size (pt) that is still comfortable to read
const GAPMAX=.9,LSMAX=.12;                        // how far a short line may be spread (em / em)
const measure=(t,fs)=>{ctx.font=`${fs}px ${FONT}`;return ctx.measureText(t).width};
/* Flow the words over the rectangles, trying the biggest font first.
   fit=false when it only works below MINFS (text too long for the space). */
const flow=(text,rects,fs0)=>{
  const words=text.split(/ +/).filter(Boolean);
  for(let fs=fs0;fs>=4;fs-=.25){
    const sp=measure(" ",fs);
    const lines=rects.map(()=>[]);let ri=0,used=0,ok=true;
    for(const w of words){
      const ww=measure(w,fs);
      const W=rects[ri][2]-rects[ri][0]-3;
      const need=(lines[ri].length?sp:0)+ww;
      if(used+need<=W){lines[ri].push(w);used+=need}
      else if(ri<rects.length-1&&lines[ri].length){ri++;used=ww;lines[ri].push(w);if(used>rects[ri][2]-rects[ri][0]-3){ok=false;break}}
      else{ok=false;break}
    }
    if(ok)return{fs,lines,fit:fs>=MINFS};
  }
  return{fs:4,lines:rects.map((_,i)=>i?[]:[text]),fit:false};
};
const memo=new Map();
const layout=(s,text)=>{
  const key=s.n+"|"+text;let v=memo.get(key);
  if(!v){const hs=s.r.map(r=>r[3]-r[1]);v=flow(text,s.r,Math.min(11,Math.min(...hs)*.82));memo.set(key,v);if(memo.size>600)memo.clear()}
  return v;
};
/* One line: words spread over the width (justified), so short entries do not leave a gap */
function fillLine(d,words,W,fs,f){
  const sp=measure(" ",fs),n=words.length;
  const nat=words.reduce((a,w)=>a+measure(w,fs),0)+(n-1)*sp;
  let extra=Math.max(0,W-nat),gap=sp,ls=0;
  if(n>1){const add=Math.min(extra,(n-1)*fs*GAPMAX);gap=sp+add/(n-1);extra-=add}
  const chars=words.join("").length;
  if(extra>0&&chars>1)ls=Math.min(extra/chars,fs*LSMAX);
  const ln=document.createElement("div");ln.className="ln";
  ln.style.cssText=`gap:${gap*f}px;letter-spacing:${ls*f}px`;
  words.forEach(w=>{const sp2=document.createElement("span");sp2.textContent=w;ln.appendChild(sp2)});
  d.appendChild(ln);
}
/* The agreement is a picture with blanks. Each value is written in its blank at the
   normal word spacing; the rest of that text row (the printed words after the blank)
   is cut out of the page picture and moved up against the value, so a short value
   leaves no hole. Rows are handled one by one, left to right. */
const PW=612;                                     // page width in PDF points
const srcOf=k=>{
  const e=pageEls[k];if(!e)return null;
  const el=e.canvas||e.im;if(!el)return null;
  if(e.im&&!e.im.complete)return null;
  const w=e.im?e.im.naturalWidth:el.width,h=e.im?e.im.naturalHeight:el.height;   // img.width is the displayed size, not the picture's
  return(w&&h)?{el,w,h}:null;
};
function slotDiv(ov,x,r,w,fs,f,text,lw){
  const d=document.createElement("div");d.className="slot ok";
  d.style.cssText=`left:${x*f}px;top:${(r[1]-1)*f}px;width:${(w+1)*f}px;height:${(r[3]-r[1]+3)*f}px;font-size:${fs*f}px;padding-left:${f}px`;
  const inn=document.createElement("span");inn.style.whiteSpace="nowrap";
  text.split(" ").forEach((word,wi)=>{
    if(wi)inn.appendChild(document.createTextNode(" "));
    word.split(NB).forEach((part,pi)=>{
      if(pi)inn.appendChild(document.createTextNode(NB));
      if(lw&&lw.has(part)){inn.appendChild(document.createTextNode(part))}      // printed word of the agreement: normal text, no colour
      else{const v=document.createElement("span");v.className="v";v.textContent=part;inn.appendChild(v)}   // value taken from the HR records
    });
  });
  d.appendChild(inn);d.title=text;
  d.onclick=()=>toast("This value is taken from the HR records");
  ov.appendChild(d);
}
function drawRow(k,row,f){
  const e=pageEls[k],ov=e.ov,src=srcOf(k);
  const y1=Math.min(...row.map(i=>i.r[1]))-1,y2=Math.max(...row.map(i=>i.r[3]))+2;
  const x0=row[0].r[0];
  if(!src){                                       // picture not ready yet: plain per-blank fill
    row.forEach(it=>{
      const cover=document.createElement("div");cover.className="slot";
      cover.style.cssText=`background:#fff;left:${(it.r[0]-1)*f}px;top:${(it.r[1]-1)*f}px;width:${(it.r[2]-it.r[0]+2)*f}px;height:${(it.r[3]-it.r[1]+3)*f}px`;
      ov.appendChild(cover);
      if(it.words.length){const t=it.words.join(" ");slotDiv(ov,it.r[0]-1,it.r,measure(t,it.fs),it.fs,f,t,it.lw)}
    });
    return;
  }
  const cover=document.createElement("div");cover.className="slot";
  cover.style.cssText=`background:#fff;left:${(x0-1)*f}px;top:${y1*f}px;width:${(PW-x0)*f}px;height:${(y2-y1)*f}px`;
  ov.appendChild(cover);
  /* Keep the whole row (values AND the printed words after them, e.g. ነዋሪነታቸው, ወረዳ)
     inside the text area: when the values are longer than the blanks were, they are written
     a little smaller instead of pushing the printed words out of the page. */
  const segW=(a0,b0)=>{const a=a0>x0?a0+1.5:a0,b=b0<PW?b0-.5:b0;return Math.max(0,b-a)};
  const rowEnd=row[row.length-1].r[2],LIM=Math.max(541,rowEnd);
  const endAt=k=>{
    let c=x0,pe=x0;
    row.forEach((it,n)=>{
      if(n)c+=segW(pe,it.r[0]);
      if(it.words.length)c+=measure(it.words.join(" "),it.fs*k)+measure(" ",it.fs*k);
      pe=it.r[2];
    });
    return c+Math.max(0,Math.min(540,LIM)-pe);
  };
  let rk=1;
  if(endAt(1)>LIM){
    let lo=.5,hi=1;
    for(let i=0;i<14;i++){const mid=(lo+hi)/2;if(endAt(mid)>LIM)hi=mid;else lo=mid}
    rk=lo;
  }
  const kx=src.w/PW,ky=src.h/792,dpr=window.devicePixelRatio||1;
  let cursor=x0;
  const seg=(a0,b0)=>{                            // printed words between two blanks, moved to the cursor
    const a=a0>x0?a0+1.5:a0,b=b0<PW?b0-.5:b0;      // skip the edge of the template's own green box
    const w=b-a;if(w<=.5)return;
    const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(w*f*dpr));c.height=Math.max(1,Math.round((y2-y1)*f*dpr));
    c.style.cssText=`position:absolute;left:${cursor*f}px;top:${y1*f}px;width:${w*f}px;height:${(y2-y1)*f}px;pointer-events:none`;
    c.getContext("2d").drawImage(src.el,a*kx,y1*ky,w*kx,(y2-y1)*ky,0,0,c.width,c.height);
    ov.appendChild(c);cursor+=w;
  };
  let prevEnd=x0;
  row.forEach((it,n)=>{
    if(n)seg(prevEnd,it.r[0]);
    if(it.words.length){
      const t=it.words.join(" "),fs=it.fs*rk,w=measure(t,fs);
      slotDiv(ov,cursor-1,it.r,w,fs,f,t,it.lw);
      cursor+=w+measure(" ",fs);                  // one normal word gap after the value
    }
    prevEnd=it.r[2];
  });
  seg(prevEnd,PW);
}
function drawOverlays(){
  for(const k in pageEls){pageEls[k].ov.innerHTML=""}
  const f=scale,items={},blanks=[];
  SLOTS.forEach(s=>{
    const text=s.t.replace(/\{([\w@]+)\}/g,(m,id)=>val(id));
    if(!s.t){blanks.push(s);return}
    const {fs,lines}=layout(s,text);
    const lw=new Set(s.t.replace(/\{[\w@]+\}/g," ").split(/\s+/).filter(Boolean));   // the printed words of this blank
    s.r.forEach((r,i)=>{(items[s.p]=items[s.p]||[]).push({r,fs,words:lines[i]||[],lw})});
  });
  for(const k in items){
    if(!pageEls[k])continue;
    const list=items[k].slice().sort((a,b)=>a.r[1]-b.r[1]||a.r[0]-b.r[0]),rows=[];
    list.forEach(it=>{
      const row=rows.find(r=>Math.abs(r[0].r[1]-it.r[1])<=2.5&&Math.abs(r[0].r[3]-it.r[3])<=3);
      if(row)row.push(it);else rows.push([it]);
    });
    rows.forEach(row=>{row.sort((a,b)=>a.r[0]-b.r[0]);drawRow(k,row,f)});
  }
  blanks.forEach(s=>{
    s.r.forEach(r=>{const d=document.createElement("div");d.className="slot";d.style.cssText=`background:#fff;left:${(r[0]-.5)*f}px;top:${(r[1]-1)*f}px;width:${(r[2]-r[0]+1)*f}px;height:${(r[3]-r[1]+3)*f}px`;pageEls[s.p].ov.appendChild(d)});
  });
  /* "Agreed" replaces the signature, only on the signature places (never in a page footer) */
  SIGS.forEach(g=>{
    const has=!!S.sigs[g.id],c=copyOf(g.id);
    const mine=SIGROLE(g.id)===role&&CAN&&(c==null||c===ACTIVE)&&!agreedAlready();
    if(!has&&!mine)return;
    const d=document.createElement("div");
    d.className="sig "+(has?"ok":"todo");
    const r=g.r;d.style.cssText=`left:${r[0]*f}px;top:${r[1]*f}px;width:${(r[2]-r[0])*f}px;height:${(r[3]-r[1])*f}px;font-size:${12*f}px`;
    if(has){
      /* Signer's name first, then "Agreed" */
      const sigKey=g.id;
      const signerName=NAMES[sigKey]||"";
      d.innerHTML="";
      d.style.flexDirection="column";
      d.style.alignItems="center";
      d.style.justifyContent="center";
      d.style.overflow="visible";
      /* Name FIRST, "Agreed" under it. The box is solid white so it also hides
         the printed dashed/solid line that used to sit between them. In the small
         guarantor boxes it is made a little taller so the line is fully covered. */
      d.style.background="#fff";
      if((r[3]-r[1])<30)d.style.height=`${(r[3]-r[1]+6)*f}px`;
      if(signerName){
        const nameEl=document.createElement("div");
        nameEl.style.cssText=`font-size:${9.5*f}px;font-weight:700;color:#1d1d1b;text-align:center;line-height:1.2;white-space:nowrap;font-family:"NotoEth","Nyala",sans-serif`;
        nameEl.textContent=signerName;
        d.appendChild(nameEl);
      }
      const agreedEl=document.createElement("div");
      agreedEl.style.cssText=`font-size:${11*f}px;font-weight:700;color:#0a1f6b;text-align:center;line-height:1.2;white-space:nowrap`;
      agreedEl.textContent="Agreed";
      d.appendChild(agreedEl);
    }else{
      d.textContent="Agree here";
    }
    if(!has)d.onclick=()=>agree();
    pageEls[g.p].ov.appendChild(d);
  });
}
let loadedPdfDoc = null;
async function initPdfDoc() {
  if (_PDF.pdf_url && window.pdfjsLib) {
    try {
      if (window.pdfjsLib.GlobalWorkerOptions) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/web/static/lib/pdfjs/build/pdf.worker.js';
      }
      loadedPdfDoc = await pdfjsLib.getDocument(_PDF.pdf_url).promise;
    } catch (e) {
      console.warn("Could not load PDF document directly, falling back to images:", e);
    }
  }
}

/* A trailing page with nothing on it (after the guarantor pages) is removed from the view */
function relabel(){
  DISPLAY.forEach((pg,idx)=>{
    const el=pageEls[pg.key];
    if(el)el.wrap.querySelector(".pn").textContent=(idx+1)+" / "+DISPLAY.length+(pg.k!=null?" · "+(PARTS[pg.k].name||"Guarantor "+(pg.k+1))+" (Guarantor)":"");
  });
}
function dropIfBlank(pg,src){
  if(pg.k!=null||pg.n<=3)return;                 // only the page after the guarantor pages can be dropped
  try{
    const W=200,H=260,c=document.createElement("canvas");c.width=W;c.height=H;
    const x=c.getContext("2d",{willReadFrequently:true});x.fillStyle="#fff";x.fillRect(0,0,W,H);
    x.drawImage(src,0,0,W,H);
    const d=x.getImageData(0,0,W,H).data;
    for(let i=0;i<d.length;i+=4){if(d[i]<248||d[i+1]<248||d[i+2]<248)return}
  }catch(e){return}
  const el=pageEls[pg.key];if(el){el.wrap.remove();delete pageEls[pg.key]}
  const at=DISPLAY.indexOf(pg);if(at>=0)DISPLAY.splice(at,1);
  relabel();
}
async function renderPages(){
  if(window.matchMedia&&matchMedia("print").matches)return;      // never re-layout while printing
  const host=$("#pages");
  scale=Math.min(820,host.clientWidth)/612;
  if(!loadedPdfDoc && _PDF.pdf_url && window.pdfjsLib){
    await initPdfDoc();
  }
  DISPLAY.forEach((pg,idx)=>{
    if(!pageEls[pg.key]){
      const wrap=document.createElement("div");wrap.className="page";
      const ov=document.createElement("div");ov.style.cssText="position:absolute;inset:0";
      const pn=document.createElement("div");pn.className="pn";
      pn.textContent=(idx+1)+" / "+DISPLAY.length+(pg.k!=null?" · "+(PARTS[pg.k].name||"Guarantor "+(pg.k+1))+" (Guarantor)":"");

      if(loadedPdfDoc){
        const canvas=document.createElement("canvas");
        canvas.style.cssText="display:block;width:100%;height:auto";
        wrap.append(canvas,ov,pn);
        host.appendChild(wrap);
        pageEls[pg.key]={wrap,ov,canvas};

        const pageNum = Math.min(pg.n, loadedPdfDoc.numPages);
        pending++;
        loadedPdfDoc.getPage(pageNum).then(page => {
          const unscaledViewport = page.getViewport({ scale: 1 });
          const targetW = Math.min(820, host.clientWidth || 820);
          const renderScale = (targetW / unscaledViewport.width) * (window.devicePixelRatio || 1.5);
          const viewport = page.getViewport({ scale: renderScale });
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          page.render({ canvasContext: ctx, viewport: viewport }).promise.then(()=>{dropIfBlank(pg,canvas);drawOverlays()}).finally(()=>{pending--});
        }).catch(()=>{pending--});
      } else {
        const im=new Image();im.src=PAGES[pg.n-1]||PAGES[0];im.alt="Page "+(idx+1);im.style.cssText="display:block;width:100%;height:auto";pending++;im.onload=()=>{dropIfBlank(pg,im);drawOverlays();pending--};im.onerror=()=>{pending--};
        wrap.append(im,ov,pn);
        host.appendChild(wrap);
        pageEls[pg.key]={wrap,ov,im};
      }
    }
  });
  drawOverlays();
}

/* ---- sidebar ---- */
function renderRoles(){
  const r=$("#roles");r.innerHTML="";
  const a=document.createElement("span");a.textContent=CFG.ref;r.appendChild(a);
  const b=document.createElement("span");b.className="me";b.textContent=ROLES[role]||"View only";r.appendChild(b);
  if(CFG.canPrint){
    const pb=document.createElement("button");pb.id="printBtn";pb.textContent="🖨 Print";
    pb.title="Print the agreement";pb.onclick=()=>printAgreement();r.appendChild(pb);
  }
  if(_PDF.pdf_url){
    const d=document.createElement("a");d.href=_PDF.pdf_url;d.target="_blank";
    d.textContent="📄 Original PDF";d.style.cssText="border:1px solid var(--line);padding:6px 12px;border-radius:999px;font:inherit;color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px";
    r.appendChild(d);
  }
}
function renderForm(){
  const c=$("#formCard");
  if(role==="viewer"){c.innerHTML="<h2>View only</h2><p style='margin:0;color:var(--muted)'>You can read this agreement and its documents. Only the requester, the guarantor and the bank approver can agree to it.</p>"+(CFG.why?"<p style='margin:10px 0 0;color:var(--bad)'>"+esc(CFG.why)+"</p>":"");return}
  c.innerHTML=`<h2>${esc(whoName(role))} – details</h2>`;
  const note=document.createElement("p");note.style.cssText="margin:0 0 8px;color:var(--muted);font-size:12px";
  note.textContent=CFG.editable?"These details are taken from the HR records and are filled in the agreement automatically. Check them, then press Agree and continue.":(role==="requester"?"Your guarantor(s) must agree first. You will be notified when they are done, then you can agree here.":"This part is locked: it can no longer be changed.");
  c.appendChild(note);
  const rows=role==="requester"?FIELDS_A:(role==="approver"?FIELDS_BANK:FIELDS_B.map(([k,l])=>[k+"@"+ACTIVE,l]));
  const ul=document.createElement("ul");ul.className="st";
  rows.forEach(([id,label])=>{
    const li=document.createElement("li");li.style.cssText="gap:10px;align-items:flex-start";
    const a=document.createElement("span");a.textContent=label;a.style.color="var(--muted)";
    const b=document.createElement("span");b.textContent=val(id);b.style.cssText="text-align:right;word-break:break-word";
    li.append(a,b);ul.appendChild(li);
  });
  c.appendChild(ul);
  if(CAN){
    const row=document.createElement("div");row.className="row";row.style.marginTop="14px";
    if(agreedAlready()){
      const ok=document.createElement("p");ok.style.cssText="margin:0;color:var(--ok);font-weight:600";
      ok.textContent="✓ You have agreed to this agreement.";
      c.append(ok);
    }else{
      const sb=document.createElement("button");sb.className="p";
      sb.textContent="Agree and continue";sb.dataset.agree="1";
      sb.onclick=()=>agree();
      row.append(sb);c.append(row);
    }
  }
}
function renderStatus(){
  const c=$("#statusCard");
  c.innerHTML="<h2>Agreement status</h2><ul class='st'></ul>";
  const ul=c.querySelector("ul");
  const rows=[[whoName("requester"),!!S.status.requester]];
  PARTS.forEach((p,k)=>rows.push([(p.name||"Guarantor "+(k+1))+" ("+ROLES.guarantor+")",!!p.complete]));
  rows.push([whoName("approver"),!!S.status.approver]);
  rows.forEach(([label,done])=>{
    ul.innerHTML+=`<li><span></span><span class="${done?"good":"bad"}">${done?"Complete":"Pending"}</span></li>`;
    ul.lastElementChild.firstChild.textContent=label;
  });
}
function renderAll(){renderRoles();renderForm();renderStatus();drawOverlays()}

/* ---- print (approvers / admin only: CFG.canPrint is decided by the server) ---- */
const LETTER_PX=815;                       // 8.5in at 96 dpi, a hair under so no blank sheet follows
let screenScale=null;
function fitForPrint(){
  if(screenScale!==null)return;
  screenScale=scale;scale=LETTER_PX/612;drawOverlays();      // re-draw everything at the paper width (synchronous)
}
function unfitAfterPrint(){if(screenScale!==null){scale=screenScale;screenScale=null;drawOverlays()}}
window.addEventListener("beforeprint",fitForPrint);
window.addEventListener("afterprint",unfitAfterPrint);
async function printAgreement(){
  if(!CFG.canPrint)return;
  for(let i=0;i<150&&pending>0;i++)await new Promise(r=>setTimeout(r,100));   // wait for the pages (max 15 s)
  window.print();
}

/* ---- boot ---- */
(async()=>{
  try{await document.fonts.load("11px NotoEth","ሀ")}catch(e){}
  renderRoles();renderForm();renderStatus();
  await renderPages();
  let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(renderPages,150)});
  /* the page width can change without a window resize (a scrollbar appears, the popup is
     resized): keep the filled-in values on the same scale as the page picture */
  if(window.ResizeObserver)new ResizeObserver(()=>{
    if(screenScale!==null)return;
    const sc=Math.min(820,$("#pages").clientWidth)/612;
    if(sc>0&&Math.abs(sc-scale)>.002){scale=sc;drawOverlays()}
  }).observe($("#pages"));
  window.__ready=true;
  if(CFG.autoPrint)printAgreement();
})();
})();
</script>
