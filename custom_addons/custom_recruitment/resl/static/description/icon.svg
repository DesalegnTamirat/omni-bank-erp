<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
  <rect width="90" height="90" rx="16" fill="#1a6b8a"/>
  <!-- Person silhouette -->
  <circle cx="35" cy="28" r="10" fill="white" opacity="0.95"/>
  <path d="M15 58 Q15 42 35 42 Q55 42 55 58" fill="white" opacity="0.95"/>
  <!-- Coin/money symbol -->
  <circle cx="64" cy="56" r="18" fill="#f0a500"/>
  <circle cx="64" cy="56" r="14" fill="#f7c244"/>
  <text x="64" y="62" font-family="Arial" font-weight="bold" font-size="18"
    fill="#a06000" text-anchor="middle">$</text>
  <!-- Small upward arrow on coin to suggest loan/growth -->
  <polyline points="58,34 64,26 70,34" fill="none" stroke="#f0a500" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="64" y1="26" x2="64" y2="44" stroke="#f0a500" stroke-width="3" stroke-linecap="round"/>
</svg>
