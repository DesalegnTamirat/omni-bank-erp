<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient (Teal/Emerald with Deep Banking Foundation) -->
    <linearGradient id="kmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <!-- Golden Accent Gradient -->
    <linearGradient id="kmsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Document Stack Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <!-- Lightbulb Filament Glow -->
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="kmsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#022c22" flood-opacity="0.5"/>
    </filter>
    <filter id="glowBulb" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fde047" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- App Squircle Shape -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#kmsBg)"/>

  <!-- Subtle Inner Top Highlight -->
  <path d="M 0 56 A 56 56 0 0 1 56 0 L 200 0 A 56 56 0 0 1 256 56 L 256 70 C 200 80, 56 80, 0 70 Z" fill="white" opacity="0.08"/>

  <!-- KMS Main Graphic -->
  <g filter="url(#kmsShadow)">
    <!-- Base Library Ledger / Document Base -->
    <!-- Page 1 (Bottom angled) -->
    <path d="M 46 172 Q 128 152 128 178 Q 128 152 210 172 L 204 182 Q 128 162 128 188 Q 128 162 52 182 Z" fill="#99f6e4" opacity="0.7"/>
    <!-- Page 2 (Main Open Book) -->
    <path d="M 40 162 Q 128 136 128 166 Q 128 136 216 162 L 210 120 Q 128 98 128 124 Q 128 98 46 120 Z" fill="url(#docGrad)"/>
    <line x1="128" y1="125" x2="128" y2="186" stroke="#0d9488" stroke-width="2.5" opacity="0.6"/>

    <!-- Left Page Policy Lines -->
    <line x1="62" y1="130" x2="110" y2="137" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="62" y1="142" x2="106" y2="149" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="64" y1="154" x2="98" y2="160" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Page Policy Lines -->
    <line x1="146" y1="137" x2="194" y2="130" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="150" y1="149" x2="194" y2="142" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="158" y1="160" x2="192" y2="154" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Glowing Knowledge Lightbulb Emanating from Book -->
    <!-- Rays of Insight -->
    <g stroke="url(#kmsGold)" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="128" y1="36" x2="128" y2="24"/>
      <line x1="84" y1="52" x2="74" y2="44"/>
      <line x1="172" y1="52" x2="182" y2="44"/>
      <line x1="68" y1="84" x2="56" y2="84"/>
      <line x1="188" y1="84" x2="200" y2="84"/>
    </g>

    <!-- Lightbulb Body -->
    <path d="M 104 82 C 104 68 114 56 128 56 C 142 56 152 68 152 82 C 152 92 144 100 142 108 L 114 108 C 112 100 104 92 104 82 Z" fill="url(#bulbGrad)" filter="url(#glowBulb)"/>

    <!-- Lightbulb Filament Spark (Neural / Brain knot) -->
    <path d="M 122 84 Q 128 72 134 84 Q 128 92 122 84 Z" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Lightbulb Metallic Base -->
    <rect x="115" y="110" width="26" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="117" y="116" width="22" height="4" rx="2" fill="#94a3b8"/>
    <rect x="120" y="122" width="16" height="3" rx="1.5" fill="#64748b"/>

    <!-- Verified Bank Policy Security Badge (Gold Crest) -->
    <g transform="translate(162, 140)" filter="url(#kmsShadow)">
      <circle cx="26" cy="26" r="23" fill="url(#kmsGold)"/>
      <circle cx="26" cy="26" r="20" fill="#064e3b"/>
      <!-- Shield / Checkmark -->
      <path d="M 18 26 L 23 31 L 34 20" stroke="url(#kmsGold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
