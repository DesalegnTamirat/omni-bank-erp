name: bunna-lms

services:
  db:
    image: ${POSTGRES_IMAGE:?Set a digest-pinned PostgreSQL image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  odoo:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
      args:
        ODOO_BASE_IMAGE: ${ODOO_BASE_IMAGE:?Set a digest-pinned Odoo 19 image}
    image: ${ODOO_APP_IMAGE:?Set the immutable application image name}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${DB_USER:-odoo}
      PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - odoo_data:/var/lib/odoo
      - ${ODOO_CONFIG_FILE:?Set the private production odoo.conf path}:/etc/odoo/odoo.conf:ro
    expose:
      - "8069"
      - "8072"
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8069/web/login\", timeout=5)' > /dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  proxy:
    image: ${NGINX_IMAGE:?Set a digest-pinned Nginx image}
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "${HTTPS_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Set the TLS certificate path}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE:?Set the TLS private key path}:/etc/nginx/tls/privkey.pem:ro
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set the private PostgreSQL password file path}

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  odoo_data:

